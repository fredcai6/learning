[project]
name = "learnsite"
version = "0.1.0"
description = "The website for a learning vault: lessons, reviews, map, sources, log."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "jinja2>=3.1",
    "markdown>=3.8",
    "fsrs>=6.1",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "python-telegram-bot[job-queue]>=22.0",
    "httpx>=0.28",
    "pylatexenc>=2.10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learnsite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
